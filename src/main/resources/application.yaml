
repository:
  alcohol: "${ALCOHOL_REPOSITORY:hardcoded}"
  beer: "${BEER_REPOSITORY:hardcoded}"
  drink: "${DRINK_REPOSITORY:hardcoded}"
  recommendation: "${RECOMMENDATION_REPOSITORY:hardcoded}"

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
  allowed-methods: "${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}"
  allowed-headers: "${CORS_ALLOWED_HEADERS:*}"
  allow-credentials: "${CORS_ALLOW_CREDENTIALS:true}"
  max-age: "${CORS_MAX_AGE:3600}"

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${JWT_ISSUER_URI:https://auth.drinksaver.kak.im/auth/realms/drinksaver}"
          jwk-set-uri: "${JWT_JWK_SET_URI:https://auth.drinksaver.kak.im/auth/realms/drinksaver/protocol/openid-connect/certs}"